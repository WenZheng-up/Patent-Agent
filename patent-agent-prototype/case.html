  <script>
  (function () {
    'use strict';

    var DBcase = null; /* fetchCase 加载后的案件全量数据 */
    var state = { approved: false, running: false, session: '', query: null, hits: [] };

    function $(id) { return document.getElementById(id); }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* 静态占位图标统一经 window.icon() 注入 */
    function injectIcons() {
      document.querySelectorAll('[data-icon]').forEach(function (el) {
        var size = parseInt(el.getAttribute('data-icon-size') || '16', 10);
        el.innerHTML = icon(el.getAttribute('data-icon'), size);
      });
    }

    /* ---------- 顶部状态区 ---------- */
    function setStepper(done, active) {
      document.querySelectorAll('#stepper .step').forEach(function (s, i) {
        var n = i + 1;
        s.classList.toggle('is-done', n <= done);
        s.classList.toggle('is-active', n === active);
      });
    }

    function setStatus(stage) {
      var map = {
        review: ['检索式待审批', 'tag-pending'],
        run: ['检索执行中', 'tag-processing'],
        done: ['检索完成 · 待对比分析', 'tag-done']
      };
      $('status-tag').className = 'tag ' + map[stage][1];
      $('status-tag').textContent = map[stage][0];
    }

    function runtimeTag(text, cls) {
      $('runtime-tag').className = 'tag ' + cls;
      $('runtime-tag').textContent = text;
    }

    /* ---------- 静态数据填充（只读 DB） ---------- */
    function fillStatic() {
      $('page-title').textContent = DBcase.title;
      $('page-sub').innerHTML =
        '<span class="mono">' + esc(DBcase.id) + '</span> · ' + esc(DBcase.client) +
        ' · IPC <span class="mono">' + esc(DBcase.field) + '</span> · 立案 ' + esc(DBcase.filed) +
        ' · 更新于 ' + esc(DBcase.updated);

      $('disc-problem').textContent = DBcase.disclosure.problem;
      $('disc-solution').textContent = DBcase.disclosure.solution;
      $('disc-effect').textContent = DBcase.disclosure.effect;
      $('disc-terms-label').textContent = '关键术语 · ' + DBcase.disclosure.terms.length + ' 项（Agent 提取，仅展示）';
      $('disc-terms').innerHTML = DBcase.disclosure.terms.map(function (t) {
        return '<span class="chip">' + esc(t) + '</span>';
      }).join('');
      $('disc-words').textContent = '交底书全文 ' + DBcase.disclosure.wordCount.toLocaleString() +
        ' 字，三要素与关键术语已解析入库。';

      $('meta-client').textContent = DBcase.client;
      $('meta-contact').textContent = DBcase.clientContact || '—';
      $('meta-ipc').textContent = DBcase.field || '—';
      $('meta-words').textContent = (DBcase.disclosure.wordCount || 0).toLocaleString() + ' 字';
      $('meta-db').textContent = (DBcase.reportMeta && DBcase.reportMeta.db)
        || '中国专利数据库（AMiner · 摘要 + 全文两阶段）';
      if (DBcase.retrievalSummary) {
        var s = DBcase.retrievalSummary;
        $('hits-meta').textContent = '粗检并集 ' + s.coarseTotal + ' 篇（' + s.coarseMultiHit +
          ' 篇多组合命中）· 精检 ' + s.finePatents + ' 篇全文 · 付费 ' + s.paidDetailCalls + ' 次';
      }
    }

    /* ---------- 检索式工作台 ---------- */
    function fillInputs() {
      $('q-topic').value = state.query.topic;
      $('q-date-from').value = state.query.dateFrom;
      $('q-date-to').value = state.query.dateTo;
    }

    function renderChips(key, locked) {
      var html = state.query[key].map(function (v) {
        return '<span class="chip">' + esc(v) +
          (locked ? '' : '<button type="button" data-remove="' + esc(v) + '" title="移除">' + icon('x', 11) + '</button>') +
          '</span>';
      }).join('');
      if (!locked) html += '<input type="text" placeholder="输入后回车添加">';
      $('chips-' + key).innerHTML = html;
    }

    function buildExpr() {
      var parts = [];
      if (state.query.keywords.length) parts.push('(' + state.query.keywords.join(' OR ') + ')');
      if (state.query.synonyms.length) parts.push('(' + state.query.synonyms.join(' OR ') + ')');
      return parts.join(' AND ');
    }

    function updateExpr() {
      var lint = $('q-lint');
      var btn = $('btn-confirm');
      /* 代理师未改动检索要素时，展示服务端权威 expr/lint（完整 CNF 4 组） */
      if (DBcase && DBcase.query && DBcase.query.expr && !isEdited()) {
        $('q-expr').textContent = DBcase.query.expr;
        if (btn && !state.running && !state.approved) btn.disabled = false;
        return;
      }
      var expr = buildExpr();
      $('q-expr').textContent = expr || '（关键词与同义词均为空，请至少补充一个关键词）';
      if (!state.query.keywords.length) {
        lint.className = 'tag tag-pending';
        lint.innerHTML = icon('alert-triangle', 12) + '缺少关键词 · 不可执行';
        if (btn && !state.running) btn.disabled = true;
      } else {
        lint.className = 'tag tag-done';
        lint.innerHTML = icon('check', 12) + '语法校验通过 · 可执行';
        if (btn && !state.running && !state.approved) btn.disabled = false;
      }
    }

    function isEdited() {
      var q = DBcase.query;
      return state.query.topic !== q.topic ||
        JSON.stringify(state.query.keywords) !== JSON.stringify(q.keywords) ||
        JSON.stringify(state.query.synonyms) !== JSON.stringify(q.synonyms) ||
        JSON.stringify(state.query.ipc) !== JSON.stringify(q.ipc) ||
        state.query.dateFrom !== q.dateFrom || state.query.dateTo !== q.dateTo;
    }

    function buildPayload() {
      return {
        topic: state.query.topic,
        keywords: state.query.keywords.slice(),
        synonyms: state.query.synonyms.slice(),
        ipc: state.query.ipc.slice(),
        dateFrom: state.query.dateFrom,
        dateTo: state.query.dateTo,
        expr: buildExpr()
      };
    }

    function lockWorkbench() {
      $('q-topic').disabled = true;
      $('q-date-from').disabled = true;
      $('q-date-to').disabled = true;
      ['keywords', 'synonyms', 'ipc'].forEach(function (k) { renderChips(k, true); });
      $('wb-tag').className = 'tag tag-done';
      $('wb-tag').textContent = '已确认';
      $('query-actions').innerHTML =
        '<button class="btn btn-ghost" id="btn-regen">' + icon('refresh-cw', 15) + '重新生成检索式</button>';
      $('btn-regen').addEventListener('click', function () {
        toast('演示原型：重新进入审批流');
      });
    }

    /* ---------- Agent 运行时事件流 ---------- */
    function appendEvent(ev) {
      var log = $('event-log');
      var row = document.createElement('div');
      row.className = 'event-item' + (ev.type ? ' is-' + ev.type : '');
      row.innerHTML = '<span class="event-ts">' + esc(ev.ts) + '</span>' +
        '<span class="event-tag">' + esc(ev.tag) + '</span>' +
        '<span class="event-msg">' + esc(ev.msg) + '</span>';
      log.insertBefore(row, $('event-cursor-row'));
      log.scrollTop = log.scrollHeight;
    }

    function renderEvents(list) {
      list.forEach(appendEvent);
    }

    /* ---------- 检索结果 ---------- */
    function renderHitsTable() {
      var tr = state.hits.map(function (h, i) {
        var pct = fmtScore(h.score);
        var stageTag = h.stage === '全文'
          ? '<span class="tag tag-processing">全文</span>'
          : '<span class="tag tag-info">摘要</span>';
        var dcNote = (h.stage === '全文' && h.dataCompleteness && !h.dataCompleteness.hasClaims)
          ? '<div class="fs-12 text-faint mt-0">⚠ 权项缺失，比对基于说明书</div>' : '';
        var comboNote = h.coarseScore != null
          ? '<div class="fs-12 text-sub mt-0">命中 ' + h.coarseScore + '/' + (h.subqueryTotal || '?') + ' 组合</div>'
          : '';
        return '<tr>' +
          '<td><label class="checkbox"><input type="checkbox" data-idx="' + i + '"' + (h.checked ? ' checked' : '') + '></label></td>' +
          '<td class="num">' + esc(h.pubNo || '—') + '</td>' +
          '<td><strong>' + esc(h.title) + '</strong>' +
            '<div class="fs-12 text-sub mt-0">' + esc(h.assignee || '申请人未公开') + '</div>' + dcNote + '</td>' +
          '<td class="num">' + esc(h.date) + '</td>' +
          '<td>' + stageTag + '</td>' +
          '<td><div class="score-bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="fs-12 text-sub mt-0">' + pct + '%</div>' + comboNote + '</td>' +
        '</tr>';
      }).join('');
      $('hits-body').innerHTML = tr;
      updateSelected();
    }

    function updateSelected() {
      var n = state.hits.filter(function (h) { return h.checked; }).length;
      $('hits-selected').textContent = '已选 ' + n + ' 篇对比文件';
      $('btn-compare').disabled = n === 0;
    }

    function showHits() {
      var card = $('card-hits');
      if (!card.hidden) return;
      card.hidden = false;
      card.classList.add('reveal');
    }

    /* ---------- HITL 确认 → 检索执行（SSE 实时事件流）→ 完成态 ---------- */
    function finishRun(summary) {
      state.approved = true;
      state.running = false;
      setStepper(3, 4);
      setStatus('done');
      runtimeTag('已完成', 'tag-done');
      lockWorkbench();
      showHits();
      $('hits-meta').textContent = '粗检并集 ' + summary.coarseTotal + ' 篇（' +
        summary.coarseMultiHit + ' 篇多组合命中）· 精检 ' + summary.finePatents +
        ' 篇全文 · 付费 ' + summary.paidDetailCalls + ' 次';
      toast('检索完成：粗检 ' + summary.coarseTotal + ' 篇，精检 ' +
            summary.finePatents + ' 篇全文，可进入对比分析');
    }

    async function runFlow() {
      var payload = buildPayload();
      var edited = isEdited();
      /* 未编辑时沿用服务端权威 CNF 分组（保留完整 4 组语义）；编辑后按表达式解析 */
      if (!edited) { payload.expr = DBcase.query.expr; payload.groups = DBcase.query.groups; }
      payload.dateFrom = state.query.dateFrom;
      payload.dateTo = state.query.dateTo;
      payload.ipc = state.query.ipc;
      payload.budget = parseInt($('q-budget').value, 10) || 20;

      var res;
      try {
        res = await confirmQuery(DBcase.id, payload, edited);
      } catch (e) {
        toast('审批请求失败，请重试', true);
        resetConfirmBtn();
        state.running = false;
        return;
      }
      if (res.code !== 0) {
        toast(res.msg || '检索式编译失败', true);
        resetConfirmBtn();
        state.running = false;
        return;
      }
      state.session = res.data.checkpointId || ('RS-' + Date.now().toString(36)).toUpperCase();
      $('meta-session').textContent = state.session;

      setStepper(2, 3);
      setStatus('run');
      runtimeTag('检索执行中', 'tag-processing');
      $('wb-tag').className = 'tag tag-processing';
      $('wb-tag').textContent = '执行中';

      try {
        var ret = await runRetrieval(DBcase.id, appendEvent, { budget: payload.budget });
        state.hits = ret.data.hits.map(function (h) {
          h.checked = (h.stage === '全文');  // 全文档默认勾选进入对比
          return h;
        });
        state.summary = ret.data.summary;
        renderHitsTable();
        finishRun(ret.data.summary);
      } catch (e) {
        toast((e && e.msg) ? e.msg : '检索失败，请重试', true);
        runtimeTag('执行中断', 'tag-pending');
        $('wb-tag').className = 'tag tag-pending';
        $('wb-tag').textContent = '待重试';
        resetConfirmBtn();
        state.running = false;
      }
    }

    function resetConfirmBtn() {
      var btn = $('btn-confirm');
      btn.disabled = false;
      btn.innerHTML = icon('play', 15) + '确认检索式，开始执行';
    }

    /* ---------- 事件绑定 ---------- */
    function bindEvents() {
      $('q-topic').addEventListener('input', function () { state.query.topic = this.value; });
      $('q-date-from').addEventListener('change', function () { state.query.dateFrom = this.value; });
      $('q-date-to').addEventListener('change', function () { state.query.dateTo = this.value; });

      /* 三组术语 chips：回车添加 / × 删除 */
      document.querySelectorAll('.chip-row[data-chips]').forEach(function (row) {
        var key = row.getAttribute('data-chips');
        row.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
          e.preventDefault();
          var val = e.target.value.trim();
          if (!val) return;
          if (state.query[key].indexOf(val) !== -1) { toast('「' + val + '」已在当前分组中', true); return; }
          state.query[key].push(val);
          renderChips(key, false);
          row.querySelector('input').focus();
          updateExpr();
        });
        row.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-remove]');
          if (!btn) return;
          var arr = state.query[key];
          var idx = arr.indexOf(btn.getAttribute('data-val'));
          if (idx !== -1) arr.splice(idx, 1);
          renderChips(key, false);
          updateExpr();
        });
      });

      /* 检索结果勾选统计 */
      $('hits-body').addEventListener('change', function (e) {
        if (e.target.type !== 'checkbox') return;
        var idx = parseInt(e.target.getAttribute('data-idx'), 10);
        state.hits[idx].checked = e.target.checked;
        updateSelected();
      });

      /* 进入对比分析 */
      $('btn-compare').addEventListener('click', function () {
        if (this.disabled) return;
        location.href = 'compare.html?id=' + encodeURIComponent(DBcase.id);
      });

      /* 确认检索式（HITL resume） */
      $('btn-confirm').addEventListener('click', function () {
        if (state.approved || state.running) return;
        state.running = true;
        this.disabled = true;
        this.innerHTML = icon('refresh-cw', 15) + '确认中…';
        this.querySelector('svg').classList.add('spin');
        runFlow();
      });
    }

    /* ---------- 初始化 ---------- */
    injectIcons();

    (async function init() {
      var caseId = caseIdFromUrl('CN2026-0881');
      var res = await fetchCase(caseId);
      if (!res || res.code !== 0 || !res.data) {
        toast((res && res.msg) || '案件加载失败', true);
        return;
      }
      DBcase = res.data;

      state.query = {
        topic: DBcase.query.topic,
        keywords: (DBcase.query.keywords || []).slice(),
        synonyms: (DBcase.query.synonyms || []).slice(),
        ipc: (DBcase.query.ipc || []).slice(),
        dateFrom: DBcase.query.dateFrom,
        dateTo: DBcase.query.dateTo
      };
      state.hits = (DBcase.hits || []).map(function (h) {
        h.checked = h.checked != null ? h.checked : (h.stage === '全文');
        return h;
      });
      if (DBcase.budget) { $('q-budget').value = DBcase.budget; }

      fillStatic();
      fillInputs();
      ['keywords', 'synonyms', 'ipc'].forEach(function (k) { renderChips(k, false); });
      renderHitsTable();
      bindEvents();

      /* 服务端 lint 为权威编译结果；updateExpr 会在未编辑态同步展示服务端 expr */
      if (DBcase.query.lint) {
        $('q-lint').className = 'tag tag-info';
        $('q-lint').textContent = DBcase.query.lint;
      }
      updateExpr();

      var completed = (DBcase.eventsRun && DBcase.eventsRun.length) ||
        DBcase.status === '对比分析' || DBcase.status === '已完成';
      if (completed) {
        /* 刷新恢复：服务端为状态权威，直接渲染完成态 */
        state.approved = true;
        renderEvents((DBcase.events || []).concat(DBcase.eventsRun || []));
        if (DBcase.status === '已完成') { setStepper(5, 5); } else { setStepper(3, 4); }
        setStatus('done');
        runtimeTag('已完成', 'tag-done');
        lockWorkbench();
        showHits();
      } else {
        renderEvents(DBcase.events || []);
        if (DBcase.status === '检索中') {
          setStepper(2, 3); setStatus('run'); runtimeTag('检索执行中', 'tag-processing');
        } else { setStepper(1, 2); setStatus('review'); }
      }
    })();
  })();
  </script>
</body>
</html>
