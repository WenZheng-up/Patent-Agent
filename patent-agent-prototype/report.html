  <script>
  (function () {
    'use strict';

    var paperEl = document.getElementById('paper');
    var subEl = document.getElementById('page-sub');
    var btnExport = document.getElementById('btn-export');
    var btnExportLabel = document.getElementById('btn-export-label');
    var btnPrint = document.getElementById('btn-print');

    /* HTML 转义（mock 数据渲染前统一处理） */
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* 对比文件分级标签：X / Y / A / 待精读（v1 骨架分级未生成） */
    function gradeTag(g) {
      if (g === 'X' || g === 'Y' || g === 'A') {
        var cls = g === 'X' ? 'tag-x' : (g === 'Y' ? 'tag-y' : 'tag-a');
        return '<span class="tag ' + cls + '">' + esc(g) + ' 类</span>';
      }
      return '<span class="tag tag-info">待精读</span>';
    }

    /* EvidenceRef -> §章节 ¶序号 */
    function citeText(f) {
      if (!f.evidence) return '—';
      return f.evidence.section + ' ¶' + f.evidence.paragraphIndex;
    }

    /* 两列信息表（字段 | 内容） */
    function infoTable(rows) {
      return '<div class="table-wrap"><table class="table"><colgroup><col style="width:132px"><col></colgroup><tbody>' +
        rows.map(function (r) {
          return '<tr><td class="text-sub" style="white-space:nowrap">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';
    }

    /* 单篇对比文件：小标题 + 特征比对表 + 比对结论 */
    function renderDoc(d, p) {
      var head =
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 12px">' +
          '<span class="mono" style="font-weight:700">' + esc(p.pubNo) + '</span>' +
          gradeTag(p.grade) +
          '<strong>' + esc(p.title) + '</strong>' +
          '<span class="fs-12 text-faint">' + esc(p.assignee) + ' · ' + esc(p.date) + '</span>' +
        '</div>';

      var rows = p.features.map(function (f) {
        var disclosed = { '是': '已公开', '部分': '部分公开', '否': '未公开' }[f.disclosed] || f.disclosed;
        return '<tr>' +
          '<td>' + esc(f.mine) + '</td>' +
          '<td>' + esc(f.theirs) + '</td>' +
          '<td style="white-space:nowrap">' + esc(disclosed) + '</td>' +
          '<td class="num" style="white-space:nowrap">' + esc(citeText(f)) + '</td>' +
        '</tr>';
      }).join('');

      var table =
        '<div class="table-wrap"><table class="table"><thead><tr>' +
          '<th style="min-width:200px">申请方案特征</th>' +
          '<th>对比文件公开内容</th>' +
          '<th style="white-space:nowrap">公开程度</th>' +
          '<th style="white-space:nowrap">段落引用</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';

      /* 结论段中出现的公开号以 mono 呈现；v1 骨架无 LLM 结论时给占位 */
      var concl = p.conclusion
        ? esc(p.conclusion)
        : '<span style="color:#9aa0a8">AI 精读结论 v2 待生成（当前为关键词骨架匹配）</span>';
      d.priorArt.forEach(function (q) {
        if (q.pubNo) concl = concl.split(q.pubNo).join('<span class="mono">' + q.pubNo + '</span>');
      });

      return head + table + '<p><strong>比对结论：</strong>' + concl + '</p>';
    }

    /* 报告主体渲染（内容全部来自 DB.current） */
    function render(d) {
      var q = d.query;
      var m = d.reportMeta || {
        no: '（导出后生成）',
        date: new Date().toISOString().slice(0, 10),
        searcher: 'Patent-Agent · 初筛',
        reviewer: '代理师（人工复核）',
        db: '中国专利数据库（AMiner · 摘要 + 全文两阶段）',
        hitsTotal: (d.retrievalSummary && d.retrievalSummary.coarseTotal) || 0,
        readDeep: (d.retrievalSummary && d.retrievalSummary.finePatents) || 0
      };
      d.priorArt = d.priorArt || [];
      q.keywords = q.keywords || [];
      q.synonyms = q.synonyms || [];
      q.ipc = q.ipc || [];

      subEl.innerHTML = '报告编号 <span class="mono">' + esc(m.no) + '</span> · 案件 <span class="mono">' + esc(d.id) + '</span>';

      var byGrade = {};
      d.priorArt.forEach(function (p) {
        (byGrade[p.grade] = byGrade[p.grade] || []).push(p);
      });
      function nOf(g) { return (byGrade[g] || []).length; }

      var html = '';

      /* 标题 + 元信息 */
      html += '<h1>' + esc(d.title) + '</h1>';
      html += '<p class="paper-meta">报告编号 <span class="mono">' + esc(m.no) + '</span> · 委托人 ' + esc(d.client) +
        ' · 检索完成日期 ' + esc(m.date) + ' · 复核人 ' + esc(m.reviewer) + '</p>';

      /* 一、检索基本信息 */
      html += '<h2>一、检索基本信息</h2>';
      html += infoTable([
        ['检索数据库', esc(m.db)],
        ['检索范围', esc(q.dateFrom) + ' 至 ' + esc(q.dateTo)],
        ['检索式', '<span class="num" style="word-break:break-all">' + esc(q.expr) + '</span>'],
        ['命中文献', '共 <strong>' + m.hitsTotal + '</strong> 篇 · 精读 <strong>' + m.readDeep + '</strong> 篇'],
        ['检索人', esc(m.searcher)]
      ]);

      /* 二、检索要素表 */
      html += '<h2>二、检索要素表</h2>';
      html += infoTable([
        ['主题', esc(q.topic)],
        ['关键词', esc(q.keywords.join('、'))],
        ['同义词', esc(q.synonyms.join('、'))],
        ['IPC 分类号', '<span class="num">' + esc(q.ipc.join('、')) + '</span>']
      ]);

      /* 三、对比文件分析 */
      html += '<h2>三、对比文件分析</h2>';
      var gradedCount = nOf('X') + nOf('Y') + nOf('A');
      html += '<p>经两阶段检索与全文精检，获取对比文件 ' + d.priorArt.length + ' 篇，逐篇与申请方案的技术特征对照如下' +
        (gradedCount ? '（X 类 ' + nOf('X') + ' 篇、Y 类 ' + nOf('Y') + ' 篇、A 类 ' + nOf('A') + ' 篇）：'
                    : '（X/Y/A 分级由 v2 AI 精读给出，本版为特征级骨架比对）：') + '</p>';
      html += d.priorArt.map(function (p) { return renderDoc(d, p); }).join('');

      /* 四、检索结论 */
      html += '<h2>四、检索结论</h2>';
      html += '<p>本报告为 AI 基于检索结果作出的<b>初筛意见</b>：粗检并集 ' + esc(m.hitsTotal) +
        ' 篇、精检全文 ' + esc(m.readDeep) + ' 篇，特征公开程度与段落级证据已逐篇标注。' +
        '新颖性/创造性的 X/Y/A 分级及法律结论以执业专利代理师复核为准；代理师可依据区别特征' +
        '（如材料限定、结构耦合、控制策略联动）调整权利要求撰写策略。全部证据标注至专利号与' +
        '章节段落，检索与比对过程可回放。</p>';

      /* 免责声明 */
      html += '<div class="disclaimer">免责声明：本报告由「Patent-Agent」智能检索系统自动生成初筛结论，' +
        '检索结果受数据库覆盖范围、检索式表达与匹配精度限制，不构成法律意见；全部结论均标注证据出处，' +
        '新颖性/创造性最终判断应由执业专利代理师结合权利要求书与全部案卷材料作出。</div>';

      paperEl.innerHTML = html;
    }

    /* 导出报告：loading → generateReport() → 打开 HTML 报告 */
    btnExport.addEventListener('click', async function () {
      if (btnExport.disabled) return;
      btnExport.disabled = true;
      btnExportLabel.textContent = '生成中…';
      var res = await generateReport(CASE_ID);
      btnExport.disabled = false;
      btnExportLabel.textContent = '导出 HTML 报告';
      if (res && res.code === 0 && res.data && res.data.url) {
        toast('报告已生成：' + res.data.reportNo);
        window.open(res.data.url, '_blank');
        var fresh = await fetchCase(CASE_ID);
        if (fresh && fresh.code === 0 && fresh.data) render(fresh.data);
      } else {
        toast((res && res.msg) || '导出失败，请先完成检索', true);
      }
    });

    /* 打印预览 */
    btnPrint.addEventListener('click', function () { window.print(); });

    /* 初始化：fetchCase() 取数渲染 */
    var CASE_ID = caseIdFromUrl('CN2026-0881');
    (async function init() {
      await delay(200);
      var res = await fetchCase(CASE_ID);
      if (res && res.code === 0 && res.data) render(res.data);
    })();
  })();
  </script>
