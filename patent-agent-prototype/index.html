  <script>
  (function () {
    var state = { filter: '全部', cases: [] };
    var listEl = document.getElementById('case-list');

    function statusTag(s) {
      if (s === '待审批') return '<span class="tag tag-pending">' + s + '</span>';
      if (s === '待解析') return '<span class="tag tag-info">' + s + '</span>';
      if (s === '已完成') return '<span class="tag tag-done">' + s + '</span>';
      return '<span class="tag tag-processing">' + s + '</span>';
    }

    function render() {
      var rows = state.cases.filter(function (c) {
        return state.filter === '全部' || c.status === state.filter;
      });
      if (!rows.length) {
        listEl.innerHTML = '<div class="empty-state">' + icon('inbox', 34) + '<p>当前筛选下暂无案件</p></div>';
        return;
      }
      var tr = rows.map(function (c, i) {
        return '<tr class="reveal" style="animation-delay:' + (i * 0.03) + 's">' +
          '<td class="num">' + c.id + '</td>' +
          '<td><strong>' + c.title + '</strong><div class="fs-12 text-sub mt-0">' + c.agent + '</div></td>' +
          '<td>' + c.client + '</td>' +
          '<td class="num">' + c.field + '</td>' +
          '<td>' + statusTag(c.status) + '</td>' +
          '<td><div class="score-bar"><i style="width:' + c.progress + '%"></i></div><div class="fs-12 text-sub mt-0">' + c.progress + '%</div></td>' +
          '<td class="fs-12 text-sub">' + c.updated + '</td>' +
          '<td><a class="btn btn-ghost btn-sm" href="case.html?id=' + encodeURIComponent(c.id) + '">查看' + icon('chevron-right', 13) + '</a></td>' +
        '</tr>';
      }).join('');
      listEl.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr>' +
        '<th>案件号</th><th style="min-width:230px">技术方案 / Agent 状态</th><th>客户</th><th>IPC</th><th>状态</th><th>进度</th><th>更新</th><th></th>' +
        '</tr></thead><tbody>' + tr + '</tbody></table></div>';
    }

    /* 状态筛选 */
    document.getElementById('filter-bar').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-filter]');
      if (!b) return;
      state.filter = b.getAttribute('data-filter');
      this.querySelectorAll('button').forEach(function (x) { x.classList.remove('active-filter'); });
      b.classList.add('active-filter');
      render();
    });

    /* 新建案件 */
    var modal = document.getElementById('modal-new');
    document.getElementById('btn-new').addEventListener('click', function () { modal.style.display = 'flex'; });
    modal.addEventListener('click', function (e) {
      if (e.target === modal || e.target.closest('[data-close]')) modal.style.display = 'none';
    });
    document.getElementById('f-submit').addEventListener('click', async function () {
      var title = document.getElementById('f-title').value.trim();
      if (!title) { toast('请填写技术方案名称', true); return; }
      var btn = this;
      btn.disabled = true; btn.textContent = '解析中…';
      var res = await createCase({
        title: title,
        client: document.getElementById('f-client').value.trim() || '未填写客户',
        disclosureText: document.getElementById('f-text').value.trim()
      });
      btn.disabled = false; btn.textContent = '解析交底书并创建';
      modal.style.display = 'none';
      if (res && res.code === 0 && res.data && res.data.id) {
        toast('案件 ' + res.data.id + ' 已创建，进入检索式审批');
        location.href = 'case.html?id=' + encodeURIComponent(res.data.id);
        return;
      }
      toast((res && res.msg) || '创建失败，请重试', true);
    });

    /* 初始化 */
    function $(id) { return document.getElementById(id); }
    function renderStats(cases) {
      var by = function (s) { return cases.filter(function (c) { return c.status === s; }).length; };
      $('stat-total').textContent = cases.length;
      $('stat-running').textContent =
        cases.filter(function (c) { return ['检索中', '对比分析', '待解析'].indexOf(c.status) !== -1; }).length;
      $('stat-pending').textContent = by('待审批');
      $('stat-done').textContent = by('已完成');
      $('greeting').textContent = '欢迎使用Patent-Agent · 当前共 ' + cases.length + ' 个案件，其中 ' +
        by('待审批') + ' 个检索式待你审批';
    }

    (async function init() {
      var res = await fetchCases();
      state.cases = res.data || [];
      renderStats(state.cases);
      render();
    })();
  })();
  </script>
