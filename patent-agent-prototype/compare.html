  <script>
  (function () {
    'use strict';

    var state = { docs: [], current: 0 };
    var els = {};
    var mainCol = document.getElementById('main-col');

    var CASE_ID = caseIdFromUrl('CN2026-0881');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function gradeTag(g) {
      if (g === 'X') return '<span class="tag tag-x">X 类</span>';
      if (g === 'Y') return '<span class="tag tag-y">Y 类</span>';
      if (g === 'A') return '<span class="tag tag-a">A 类</span>';
      return '<span class="tag tag-info">待精读</span>';
    }

    function disclosedTag(v) {
      if (v === '是') return '<span class="tag tag-x">已公开</span>';
      if (v === '部分') return '<span class="tag tag-y">部分公开</span>';
      return '<span class="tag tag-info">未公开</span>';
    }

    /* EvidenceRef -> §章节 ¶序号（悬浮显示原文摘录） */
    function citeCell(f) {
      if (!f.evidence) return '<span class="text-faint">—</span>';
      var ev = f.evidence;
      return '<span class="num mono" title="' + esc(ev.quote || '') + '">' +
        esc(ev.section) + ' ¶' + esc(ev.paragraphIndex) + '</span>';
    }

    /* —— 卡 1：文件选择器（tab 式按钮，选中项 .active-filter 高亮） —— */
    function docSelector(doc, i) {
      var pct = fmtScore(doc.score);
      return '' +
        '<button type="button" class="btn btn-ghost btn-sm' + (i === state.current ? ' active-filter' : '') + '" data-doc="' + i + '"' +
          ' style="display:flex;align-items:center;justify-content:flex-start;gap:12px;white-space:normal;text-align:left;width:100%;padding:12px 14px;">' +
          '<span style="flex:1;min-width:0;">' +
            '<span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
              '<span class="num mono" style="font-weight:700;font-size:13px;">' + doc.pubNo + '</span>' +
              gradeTag(doc.grade) +
            '</span>' +
            '<strong style="display:block;font-size:13.5px;margin-top:3px;">' + doc.title + '</strong>' +
            '<span class="fs-12 text-sub" style="display:block;margin-top:1px;">' + doc.assignee + ' · ' + doc.date + '</span>' +
          '</span>' +
          '<span style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px;">' +
            '<span class="tag tag-done">' + icon('check-circle', 12) +
              (doc.grade ? 'Sub-agent 精读完成' : '关键词骨架比对 v1') + '</span>' +
            '<span style="display:flex;align-items:center;gap:8px;">' +
              '<span class="fs-12 text-faint">相关度</span>' +
              '<span class="score-bar" style="display:inline-block;"><i style="width:' + pct + '%"></i></span>' +
              '<span class="fs-12 text-sub mono">' + pct + '%</span>' +
            '</span>' +
          '</span>' +
        '</button>';
    }

    /* —— 卡 2：当前选中文件的特征比对表 —— */
    function renderTable() {
      var doc = state.docs[state.current];
      els.tableDoc.innerHTML = '<span class="fs-12 text-faint">' + doc.features.length + ' 项技术特征</span>' +
        '<span class="tag tag-info mono">' + doc.pubNo + '</span>';
      var rows = doc.features.map(function (f) {
        return '<tr>' +
          '<td><strong>' + esc(f.mine) + '</strong></td>' +
          '<td>' + esc(f.theirs) + '</td>' +
          '<td>' + disclosedTag(f.disclosed) + '</td>' +
          '<td class="num">' + citeCell(f) + '</td>' +
        '</tr>';
      }).join('');
      els.table.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr>' +
        '<th style="min-width:220px">申请方案特征</th>' +
        '<th style="min-width:260px">对比文件公开内容</th>' +
        '<th>公开程度</th>' +
        '<th>段落引用</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    /* —— 卡 3：当前文件结论 + 综合结论 —— */
    function gradeCounts() {
      var c = { X: 0, Y: 0, A: 0 };
      state.docs.forEach(function (d) { if (c[d.grade] !== undefined) c[d.grade]++; });
      return c;
    }

    function renderConclusion() {
      var doc = state.docs[state.current];
      var c = gradeCounts();
      var graded = c.X + c.Y + c.A;
      var conclHtml = doc.conclusion
        ? esc(doc.conclusion)
        : '<span class="text-faint">AI 精读结论 v2 待生成（当前为关键词骨架匹配，不构成法律意见）</span>';
      var riskHtml = graded > 0
        ? '<div style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;background:var(--danger-soft);border:1px solid rgba(194,64,42,.3);border-radius:var(--r-md);">' +
          '<span style="flex:none;display:inline-flex;color:var(--danger);margin-top:2px;">' + icon('alert-triangle', 16) + '</span>' +
          '<span style="flex:1;min-width:0;">' +
            '<span class="fs-12" style="display:block;font-weight:700;color:var(--danger);">风险提示</span>' +
            '<span class="fs-13" style="display:block;margin-top:4px;">X/Y 类文件可能对新颖性/创造性构成威胁，区别特征构建以代理师复核结论为准。</span>' +
          '</span></div>'
        : '<div style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;background:var(--info-soft,#eef2ff);border:1px solid rgba(52,80,200,.25);border-radius:var(--r-md);">' +
          '<span style="flex:1;min-width:0;" class="fs-13">' +
            '当前为 v1 关键词骨架比对：已给出特征级公开程度与段落证据，X/Y/A 分级与法律结论待 v2 AI 精读，由代理师复核负责。</span></div>';
      els.conc.innerHTML = '' +
        '<div class="fs-12 text-faint">当前文件结论</div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;">' +
          '<span class="num mono" style="font-weight:700;font-size:13px;">' + esc(doc.pubNo) + '</span>' +
          gradeTag(doc.grade) +
        '</div>' +
        '<p class="fs-13" style="margin-top:6px;">' + conclHtml + '</p>' +
        '<hr class="divider">' +
        '<div class="fs-12 text-faint">综合结论 · 共 ' + state.docs.length + ' 篇对比文件' +
          (graded ? '' : '（分级待 v2 AI 精读）') + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">' +
          '<span class="tag tag-x">X 类 ' + c.X + ' 篇</span>' +
          '<span class="tag tag-y">Y 类 ' + c.Y + ' 篇</span>' +
          '<span class="tag tag-a">A 类 ' + c.A + ' 篇</span>' +
        '</div>' +
        riskHtml +
        '<a class="btn btn-primary btn-block" href="report.html?id=' + encodeURIComponent(CASE_ID) +
          '" style="margin-top:16px;">生成查新报告' + icon('arrow-right') + '</a>';
    }

    /* —— 切换逻辑 —— */
    function selectDoc(i) {
      if (!state.docs.length || i < 0 || i >= state.docs.length) return;
      state.current = i;
      els.tabs.querySelectorAll('button[data-doc]').forEach(function (b) {
        b.classList.toggle('active-filter', Number(b.getAttribute('data-doc')) === i);
      });
      renderTable();
      renderConclusion();
    }

    /* —— 主列渲染（数据就绪后替换加载态） —— */
    function renderMain() {
      mainCol.innerHTML = '' +
        '<div class="card reveal">' +
          '<div class="card-head">' +
            '<h2 class="card-title">' + icon('file-text') + '对比文件 · Sub-agent 精读完成</h2>' +
            '<div class="card-tools"><span class="tag tag-done">' + icon('check-circle', 12) + state.docs.length + '/' + state.docs.length + ' 篇已精读</span></div>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-tools" id="doc-tabs" style="flex-direction:column;align-items:stretch;gap:10px;"></div>' +
            '<p class="fs-12 text-faint" style="margin-top:10px;">选中文件后，下方特征比对表与比对结论将同步切换。</p>' +
          '</div>' +
        '</div>' +
        '<div class="card reveal d1">' +
          '<div class="card-head">' +
            '<h2 class="card-title">' + icon('list-checks') + '特征比对表</h2>' +
            '<div class="card-tools" id="table-doc"></div>' +
          '</div>' +
          '<div class="card-body flush" id="feature-table"></div>' +
        '</div>' +
        '<div class="card reveal d2">' +
          '<div class="card-head">' +
            '<h2 class="card-title">' + icon('scale') + '比对结论</h2>' +
          '</div>' +
          '<div class="card-body" id="conclusion-body"></div>' +
        '</div>';

      els.tabs = document.getElementById('doc-tabs');
      els.tableDoc = document.getElementById('table-doc');
      els.table = document.getElementById('feature-table');
      els.conc = document.getElementById('conclusion-body');

      els.tabs.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-doc]');
        if (!b) return;
        selectDoc(Number(b.getAttribute('data-doc')));
      });

      els.tabs.innerHTML = state.docs.map(docSelector).join('');
      selectDoc(0);
    }

    /* —— 初始化：fetchCase 取案件上下文 + fetchComparison 取数渲染 —— */
    (async function init() {
      var caseRes = await fetchCase(CASE_ID);
      if (caseRes && caseRes.code === 0 && caseRes.data) {
        document.getElementById('page-sub').textContent =
          caseRes.data.id + ' · ' + caseRes.data.title + ' · Sub-agent 精读与特征比对';
      }
      var res = await fetchComparison(CASE_ID);
      state.docs = (res && res.data) || [];
      if (!state.docs.length) {
        mainCol.innerHTML = '<div class="card"><div class="card-body">' +
          '<div class="empty-state">' + icon('inbox', 34) +
          '<p>暂无比对结果<br><span class="fs-13 text-faint">请先在案件详情页完成检索</span></p></div></div></div>';
        return;
      }
      renderMain();
    })();
  })();
  </script>
